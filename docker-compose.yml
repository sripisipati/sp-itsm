services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm_dev_only
      POSTGRES_DB: itsm
    volumes:
      - itsm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://itsm:itsm_dev_only@postgres:5432/itsm?schema=public
      JWT_SECRET: dev-only-change-me
      JWT_EXPIRES_IN: 8h
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:8080
      STORAGE_DRIVER: local
      STORAGE_DIR: /app/storage
      ATTACHMENT_MAX_BYTES: 10485760
      ATTACHMENT_ALLOWED_MIME: text/plain,text/csv,application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/json
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 300
      SEED_ON_START: "true"
    volumes:
      - itsm-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  itsm-postgres:
  itsm-storage:
